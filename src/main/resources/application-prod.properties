# Fuer Produktion ADMIN_USERNAME/ADMIN_PASSWORD_HASH/JWT_SECRET per Umgebungsvariable setzen,
# die Werte hier sind nur ein Dev-Default (Passwort: changeme123).
admin.username=${ADMIN_USERNAME:admin}
admin.password-hash=${ADMIN_PASSWORD_HASH:$2a$10$Dw/RFPvfvi7EFBSOvg8H3.eSoHBLdayaLKsGb.GeSQCk2iDYZmH8K}
jwt.secret=${JWT_SECRET:LjOkrakBf06zqQJy7MJyvu3K5TkZPbjYMsskUDIBWsZxQQAjjXlAPw/GLrVIiOUR}
