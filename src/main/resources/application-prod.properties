spring.application.name=schachdatenverwaltung

# --- Datenbank ---
# Zugangsdaten per Umgebungsvariable ueberschreibbar (gleiches Muster wie beim
# Auth-Block weiter unten). Die Defaults sind reine Dev-Werte; in Produktion
# DB_URL/DB_USERNAME/DB_PASSWORD setzen, damit das Passwort nicht aus der
# eingecheckten Datei kommt.
#
# Tests nutzen diese Werte NICHT mehr: src/test/resources/application.properties
# ueberschreibt sie mit einer H2-In-Memory-Datenbank.
spring.datasource.url=${DB_URL:jdbc:postgresql://192.168.2.103:5432/schachdatenverwaltung}
spring.datasource.username=${DB_USERNAME:schachuser}
spring.datasource.password=${DB_PASSWORD:geheim}

# Hinweis: update legt fehlende Tabellen/Spalten an, aendert aber bestehende
# Spalten nicht (siehe Identity-Problem vom 04.08.). Fuer echte Migrationen
# waere Flyway der naechste Schritt.
spring.jpa.hibernate.ddl-auto=update

# --- Auth ---
