# Fallback, falls SPRING_PROFILES_ACTIVE nirgends gesetzt ist.
# Bewusst prod statt dev: ein Deploy landet automatisch bei jedem Push auf
# main (deploy.yml), ohne dass das Profil dort explizit gesetzt wird. Ein
# Default auf dev wuerde den Produktivcontainer sonst still auf die
# H2-In-Memory-DB umschalten statt auf Postgres. Lokale Entwicklung setzt
# SPRING_PROFILES_ACTIVE=dev explizit (z. B. in der IDE-Run-Config).
spring.profiles.default=prod