# Testkonfiguration — überschreibt src/main/resources/application.properties
# für alle Testläufe (Spring lädt bei gleichem Dateinamen die Version aus dem
# Test-Klassenpfad).
#
# WARUM DIESE DATEI EXISTIERT
# Ohne sie erben die Tests die Hauptkonfiguration und verbinden sich gegen die
# Produktiv-Datenbank auf 192.168.2.103. Zusammen mit ddl-auto=update genügte
# ein `mvn test`, um dort das Schema zu verändern — die CI (runs-on: self-hosted)
# erreicht denselben Host und tat das bei jedem Push mit.
#
# H2 läuft im PostgreSQL-Kompatibilitätsmodus, damit sich Bezeichner- und
# Typverhalten möglichst nah an der echten Datenbank bewegen.
#
# NON_KEYWORDS=ALTER ist nötig, weil Spieler.age auf die Spalte "Alter" gemappt
# ist. In PostgreSQL ist das als Spaltenname zulässig, H2 behandelt ALTER
# dagegen standardmäßig als reserviertes Schlüsselwort.
spring.datasource.url=jdbc:h2:mem:schachtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=ALTER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema wird je Testlauf frisch aufgebaut und danach verworfen.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# In-Memory-DB braucht keine Konsole, und open-in-view ist im Test nur Rauschen.
spring.h2.console.enabled=false
spring.jpa.open-in-view=false

